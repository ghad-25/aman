.sections-title{display:flex;align-items:center;justify-content:space-between;margin:23px 0 12px}.sections-title h2{font-size:15.5px;font-weight:800}.all-toggle{border:0;background:transparent;color:var(--teal);font-size:11px;font-weight:800;padding:6px}.section{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:11px;overflow:hidden;box-shadow:var(--shadow);scroll-margin-top:16px}.section-button{border:0;width:100%;background:#fff;display:flex;align-items:center;justify-content:space-between;text-align:right;padding:15px 14px;gap:12px}.section-button:hover{background:#FAFDFC}.section-heading{gap:10px;min-width:0}.section-symbol{width:39px;height:39px;flex-shrink:0;border-radius:12px;background:#EEF8F6;color:var(--teal);display:grid;place-items:center}.section h3{font-size:13.5px;font-weight:800;line-height:1.65}.subtitle{font-size:10.5px;font-weight:500;color:var(--muted);display:block;margin-top:1px}.chev{color:#8CA09B;transition:transform .2s}.section[data-open="true"] .chev{transform:rotate(180deg)}.section-content{padding:0 15px 16px;border-top:1px solid #EFF3F1}.section[data-open="false"] .section-content{display:none}.section-content .intro{font-size:11px;color:var(--muted);margin:12px 0 3px}.medication{border-bottom:1px solid #EEF3F1;padding:15px 0 14px}.medication:last-child{border-bottom:0;padding-bottom:0}.detail-top{gap:10px}.med-name{font-size:12.5px;font-weight:800}.latin{font-family:Arial,sans-serif;font-size:10.5px;color:#71838B;direction:ltr;unicode-bidi:isolate;font-weight:500}.med-alt{font-size:10.5px;color:#71838B;margin-top:2px}.dose{font-size:11px;font-weight:800;color:var(--teal);background:#EDF8F5;padding:4px 9px;border-radius:8px;white-space:nowrap}.schedule{display:flex;align-items:flex-start;gap:7px;margin-top:9px;font-size:11px;color:#566E75}.schedule svg{color:#799E98;margin-top:2px}.date-block{padding:15px 0;border-bottom:1px solid #EEF3F1}.date-block:last-child{border-bottom:0;padding-bottom:0}.date-pill{displ .emergency-section{border-color:#F2DADC}.emergency-section .section-button{background:#FFF8F8}.emergency-section .section-symbol{background:#FDEBED;color:var(--red)}.emergency-section h3{color:#9E2332}.emergency-steps{list-style:none;padding:0;margin:14px 0 2px}.emergency-steps li{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #F3EAEA;font-size:11.5px;line-height:1.9;color:#4D5F66}.emergency-steps li:first-child{padding-top:0}.emergency-steps li:last-child{border:0;padding-bottom:0}.step-num{width:24px;height:24px;flex-shrink:0;display:grid;place-items:center;border-radius:8px;background:#FDEBED;color:#B72E3B;font-family:Arial,sans-serif;font-weight:800;font-size:11px}.emergency-steps strong{color:#9A2A35}.plan-note{padding:11px 12px;background:#FBF4F4;color:#8B4850;border-radius:10px;font-size:10.5px;margin-top:13px;line-height:1.9}
.quick-actions{display:flex;gap:10px;margin-top:22px}.action{min-height:52px;border-radius:13px;text-align:center;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;font-size:12px;font-weight:800;padding:8px 10px}.action.primary{background:var(--teal);color:white;flex:1.05;box-shadow:0 6px 16px rgba(15,118,110,.12)}.action.secondary{border:1.5px solid #B7D9D3;background:white;color:var(--teal);flex:1}.notice{display:flex;align-items:flex-start;gap:9px;border:1px solid #DCEAE6;border-radius:13px;padding:13px;margin-top:17px;background:#F0F8F5;font-size:10.5px;color:#55746F;line-height:1.9}.notice svg{color:var(--teal);margin-top:1px}.footnote{text-align:center;color:#7A9092;font-size:10px;margin-top:18px;line-height:1.9}.footer{padding:3px 18px 27px;text-align:center}.footer-line{height:1px;background:#DAE8E4;margin-bottom:12px}.footer p{font-size:10px;color:#83A39D;font-weight:750}

<script>
(function(){
'use strict';
const {api,esc,date,token}=AMAN;
const KEY='aman_rec_'+token;
const app=document.getElementById('app');
const svg=(id,s=21)=>`<svg width="${s}" height="${s}"><use href="#${id}"/></svg>`;
const lines=t=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);
function splitDate(l){const m=l.match(/^([^:：]{2,25})[:：]\s*(.+)$/);return m?{d:m[1],t:m[2]}:{d:'',t:l};}
function section(id,icon,title,sub,body,open,extra=''){return `<section class="section ${extra}" id="${id}" data-open="${open}"><button class="section-button" type="button" aria-expanded="${open}" aria-controls="${id}-body"><span class="section-heading"><span class="section-symbol">${svg(icon)}</span><span><h3>${title}</h3><span class="subtitle">${sub}</span></span></span><svg class="chev" width="19" height="19"><use href="#chevron"/></svg></button><div class="section-content" id="${id}-body">${body}</div></section>`;}
const empty='<p class="muted" style="padding:6px 0">لا توجد معلومات مسجلة.</p>';
function render(r){
  document.title=`أمان | الملف الطبي — ${r.name}`;
  const meds=r.meds.map(m=>`<div class="medication"><div class="detail-top"><div><div class="med-name">${esc(m.name)}</div></div>${m.dose?`<span class="dose">${esc(m.dose)}</span>`:''}</div>${m.when?`<div class="schedule">${svg('clock',15)}<span>${esc(m.when)}</span></div>`:''}</div>`).join('')||empty;
  const ep=lines(r.history.episodes).map((l,i)=>{const x=splitDate(l);return `<div class="date-block">${x.d?`<span class="date-pill ${i===0?'urgent':''}">${esc(x.d)}</span>`:''}<p class="event-copy">${esc(x.t)}</p></div>`}).join('')||empty;
  const list=t=>{const L=lines(t);return L.length?`<ul class="simple-list">${L.map(l=>{const x=splitDate(l);return `<li>${x.d?`<b>${esc(x.d)}</b>`:''}<div class="muted">${esc(x.t)}</div></li>`}).join('')}</ul>`:empty};
  const plan=lines(r.plan).map((l,i)=>`<li><span class="step-num">${i+1}</span><span>${esc(l.replace(/^\d+[.)-]\s*/,''))}</span></li>`).join('');
  const first=lines(r.plan)[0]||'';
  app.innerHTML=`
<div class="eyebrow">الخطوة ٢ من ٢ · الملف الطبي</div>
<h1 class="page-title">الملف الطبي الكامل</h1>
<p class="page-desc">معلومات المريض التفصيلية كما كتبها الطبيب المعالج.</p>
<section class="personal-card" aria-label="الهوية الطبية"><div class="person-head"><span class="avatar">${svg('user',24)}</span><div><div class="person-name">${esc(r.name)}</div><div class="person-meta">${esc(r.age)} سنة${r.sex?' · '+esc(r.sex):''}</div></div></div>
<div class="diagnosis"><div class="diagnosis-label">التشخيص الأساسي${r.diagnosisYear?' · منذ '+esc(r.diagnosisYear):''}</div><div class="diagnosis-title">${r.conditions.map(c=>esc(c.ar)).join('، ')}</div><div class="diagnosis-english">${esc(r.diagnosisNote||r.conditions.map(c=>c.en).join(', '))}</div></div>
<div class="verified">${svg('calendar',15)}آخر تأكيد من الطبيب: ${esc(date(r.lastConfirmedAt))}${r.stale?' · <b style="color:#AA6200">يحتاج تحديث</b>':''}</div></section>
${first?`<section class="emergency-teaser" aria-label="خطة الطوارئ"><div class="teaser-head">${svg('alert',20)}خطة الطوارئ — وصول سريع</div><p class="teaser-body">${esc(first.replace(/^\d+[.)-]\s*/,''))}</p><button class="teaser-btn" type="button" id="open-emergency">اطّلع على خطة الطوارئ ${svg('arrow',14)}</button></section>`:''}
<div class="jumps"><div class="jumps-title"><strong>الانتقال إلى قسم</strong><span>6 أقسام</span></div><nav class="chip-scroller" aria-label="انتقال سريع"><button class="jump" type="button" data-target="medicines">الأدوية</button><button class="jump" type="button" data-target="episodes">النوبات</button><button class="jump" type="button" data-target="treatments">العلاجات</button><button class="jump" type="button" data-target="health">التاريخ الطبي</button><button class="jump" type="button" data-target="tests">التحاليل</button><button class="jump" type="button" data-target="emergency">خطة الطوارئ</button></nav></div>
<div class="sections-title"><h2>تفاصيل السجل الطبي</h2><button type="button" class="all-toggle" id="toggle-all">عرض جميع الأقسام</button></div>
${section('medicines','pill','الأدوية الحالية',`${r.meds.length} أدوية · الجرعات والأوقات`,meds,true)}
${section('episodes','activity','النوبات السابقة',`${lines(r.history.episodes).length} مسجلة`,ep,false)}
${section('treatments','hospital','العلاجات السابقة','علاجات سابقة بالمستشفى',list(r.history.treatments),false)}
${section('health','heart','الأمراض والعمليات والحساسية','التاريخ الطبي والحساسيات',list(r.history.conditions),false)}
${section('tests','tube','التحاليل والفحوصات',`${lines(r.history.tests).length} مسجلة`,list(r.history.tests),false)}
${section('emergency','alert','خطة الطوارئ',`${lines(r.plan).length} تعليمات من الطبيب المعالج`,plan?`<ol class="emergency-steps">${plan}</ol>`:empty,false,'emergency-section')}
<div class="quick-actions"><a class="action primary" href="${amanRoute('aman_drug_checker.html')}">${svg('search',18)}افحص دواء</a><a class="action secondary" href="${amanRoute('aman_emergency_card.html')}">${svg('arrow',18)}بطاقة الطوارئ</a></div>
<div class="notice">${svg('lock',18)}<span><strong>خصوصية البيانات:</strong> فتحت هذا الملف برمز الوصول، وسُجّل الفتح في سجل المريض. يُغلق تلقائيًا بعد 30 دقيقة.</span></div>
<p class="footnote">هذه المعلومات تساعد الطبيب ولا تغني عن قراره.</p>`;
  const all=[...document.querySelectorAll('.section')];
  const setOpen=(s,o)=>{s.dataset.open=String(o);s.querySelector('.section-button').setAttribute('aria-expanded',String(o));upd()};
  const upd=()=>{document.getElementById('toggle-all').textContent=all.every(s=>s.dataset.open==='true')?'إغلاق جميع الأقسام':'عرض جميع الأقسام'};
  all.forEach(s=>s.querySelector('.section-button').addEventListener('click',()=>setOpen(s,s.dataset.open!=='true')));
  document.getElementById('toggle-all').addEventListener('click',()=>{const o=!all.every(s=>s.dataset.open==='true');all.forEach(s=>setOpen(s,o))});
  const jump=id=>{const s=document.getElementById(id);if(!s)return;setOpen(s,true);s.scrollIntoView({behavior:'smooth',block:'start'})};
  document.querySelectorAll('[data-target]').forEach(b=>b.addEventListener('click',()=>jump(b.dataset.target)));
  document.getElementById('open-emergency')?.addEventListener('click',()=>jump('emergency'));
  upd();
}
const tok=sessionStorage.getItem(KEY);
if(!tok){location.replace(amanRoute('aman_access_code.html'));return;}
api(`/api/card/${encodeURIComponent(token)}/record`,{headers:{'x-aman-record':tok}}).then(d=>render(d.record)).catch(e=>{
  if(e.status===401){sessionStorage.removeItem(KEY);location.replace(amanRoute('aman_access_code.html'));return;}
  app.innerHTML=`<div style="margin-top:30px;text-align:center"><h2>تعذّر فتح الملف</h2><p>${esc(e.message)}</p></div>`;
});
