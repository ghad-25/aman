<style>
.chips{display:flex;flex-wrap:wrap;gap:8px}

.badge.blue{background:#EAF2FC;color:#1F4F86}

.sidebar .nav-count{position:static;margin-inline-start:auto}
.contact-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.test-box{display:flex;gap:8px}

.test-result{margin-top:10px;border-radius:11px;padding:11px 12px;font-size:12px;line-height:1.8}
.test-result.avoid{background:#FFF2F2;color:#8C1D2A}.test-result.caution{background:#FFF8E9;color:#7A4A00}.test-result.info{background:#F2F7FD;color:#1F4F86}.test-result.none{background:#f0f3f6;color:#3F5560}

.scan-box{position:relative;border-radius:14px;overflow:hidden;background:#15172f;aspect-ratio:4/3;max-width:420px;margin:0 auto 12px}
.scan-box video{width:100%;height:100%;object-fit:cover;display:block}

.kind-tag{display:inline-block;font-size:10px;font-weight:800;border-radius:14px;padding:1px 8px;margin-inline-end:4px;background:#FFF2D6;color:#8C5A00;vertical-align:middle}
.kind-tag.req{background:#FFE4E5;color:#A7222F}
.alert-card.auto{border-style:dashed}
.switch-row{display:flex;gap:10px;align-items:flex-start;background:#f6f9fb;border:1px solid #dce6ed;border-radius:12px;padding:11px 12px;margin-top:14px;cursor:pointer}

.switch-row b{display:block;font-size:12.5px}.switch-row small{display:block;font-size:11px;color:var(--muted);margin-top:2px}

V7a4 4 0 0 1 8 0v3"/></symbol><symbol id="x" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol><symbol id="pill" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="8" transform="rotate(45 12 12)"/><path d="m7 7 10 10"/></symbol><symbol id="phone" viewBox="0 0 24 24"><path d="M4 4c-2 3-1 8 4 13s10 6 13 3l-4-4-3 2c-3-1-6-4-7-7l2-3-5-4Z"/></symbol></svg>
<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><symbol id="bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4l2-2Z"/><path d="M10 21h4"/></symbol><symbol id="list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol><symbol id="refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 5.3M20 4v7h-7"/></symbol><symbol id="send" viewBox="0 0 24 24"><path d="M3 11 21 3l-8 18-2-8-8-2Z"/></symbol><symbol id="ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></symbol><symbol id="barcode" viewBox="0 0 24 24"><path d="M4 5v14M7 5v14M11 5v14M14 5v14M18 5v14M20 5v14"/></symbol><symbol id="camera2" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol><symbol id="key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9m-4 4 3 3"/></symbol></svg>

<div class="shell">
<aside class="sidebar" aria-label="التنقل الجانبي"><div class="brand"><div class="mark"><svg class="ico" style="width:25px;height:25px"><use href="#shield"/></svg></div><div><strong>أمان <small style="font-size:12px;color:#707795">AMAN</small></strong><small>بوابة الطبيب المختص</small></div></div><nav id="desktop-nav"></nav><div class="sidebar-foot"><p class="minor" style="margin-bottom:12px" id="side-user"></p><button class="login-link" type="button" data-action="logout" style="border:0;background:none;cursor:pointer;font:inherit"><svg class="ico"><use href="#logout"/></svg>تسجيل الخروج</button></div></aside>
<div class="content-shell"><header class="topbar"><div class="brand mobile-brand"><div class="mark"><svg class="ico" style="width:24px;height:24px"><use href="#shield"/></svg></div><div><strong>أمان <small style="font-size:12px;color:#707795">AMAN</small></strong><small>لوحة الطبيب المختص</small></div></div><div class="desktop-top"><b style="font-size:14px">لوحة الطبيب المختص</b><p class="minor" id="top-sub">متابعة المرضى ووسائل وصولهم</p></div><button class="demo-tag" type="button" data-action="logout" id="top-user" style="border:0;cursor:pointer;font:inherit">تسجيل الخروج</button></header><main id="app" class="body-area" aria-live="polite"></main></div>
</div>
<nav class="bottom-nav" aria-label="التنقل الرئيسي" id="mobile-nav"></nav>
<div id="toast" class="floating-toast" role="status" aria-live="polite"></div>
<div class="modal-cover" id="modal-cover" role="presentation"><div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="نافذة تفاصيل"></div></div>


<script src="/assets/qr.js"></script>
<script src="/assets/scanner.js"></script>
<script src="/assets/aman.js"></script>
<script>
(()=>{'use strict';
const {api,esc,date,dateTime,ago,copy,qr}=AMAN;
let barcodes=[],bcInfo=null,me=null,patients=[],selected=null,detail=null,library=null,alerts=[],unread=0,events=[],view='overview',search='',toastTimer,pollTimer,lastUnread=-1;
const nav=[['overview','home','الرئيسية',1],['patients','users','المرضى',1],['record','file','الملف الطبي',1],['rules','list','قائمة التجنّب',0],['barcodes','barcode','باركود الأدوية',0],['access','wallet','وسائل الوصول',1],['alerts','bell','التنبيهات',1],['logs','log','سجل الوصول',0]];
const LV={avoid:['تجنّب','red'],caution:['بحذر','amber'],info:['معلومة','blue'],none:['لا تنبيه','gray']};
const icon=(id,cls='ico')=>`<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const bar=(title,desc,ic='shield')=>`<div class="page-heading"><div><div class="section-kicker">أمان | بوابة الطبيب</div><h1>${title}</h1><p class="sub">${desc}</p></div><div class="heading-illustration">${icon(ic)}</div></div>`;
const initial=n=>esc((n||'م').trim().charAt(0));
const condText=p=>(p.conditionNames||[]).join('، ');

// ---------------- data
async function loadPatients(){patients=(await api('/api/patients')).patients;if(!selected&&patients[0])selected=patients[0].id;}
async function loadDetail(){if(!selected){detail=null;return}const d=await api(`/api/patients/${selected}`);detail=d;}
async function loadAlerts(){const d=await api('/api/alerts');alerts=d.alerts;unread=d.unread;
  if(lastUnread>=0&&unread>lastUnread){const a=alerts.find(x=>x.status==='new');if(a)toast(`طلب تواصل جديد: ${a.patientName} · ${a.drug}`);}
  lastUnread=unread;drawNav();if(view==='alerts'||view==='overview')softRender();}
async function loadBarcodes(){barcodes=(await api('/api/barcodes')).barcodes;}
async function loadEvents(){events=(await api('/api/events')).events;}
async function boot(){
  try{me=(await api('/api/me')).doctor;}catch(e){location.replace('/doctor');return}
  document.getElementById('side-user').textContent=`${me.name}${me.specialty?' · '+me.specialty:''}`;
  document.getElementById('top-sub').textContent=me.name;
  if(location.hash==='#alerts')view='alerts';
  await Promise.all([loadPatients(),loadAlerts(),loadEvents()]);await loadDetail();render();
  refreshPush().then(render).catch(()=>{});
  if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',ev=>{if(ev.data&&ev.data.type==='open-alerts'){loadAlerts().then(()=>changeView('alerts'))}});
  window.addEventListener('hashchange',()=>{if(location.hash==='#alerts')changeView('alerts')});
  pollTimer=setInterval(()=>loadAlerts().catch(()=>{}),6000);
}

// ---------------- chrome
function drawNav(){
  const html=(mobile)=>nav.filter(n=>!mobile||n[3]).map(([id,ic,label])=>`<button class="nav-button ${id===view?'active':''}" type="button" data-view="${id}" aria-current="${id===view?'page':'false'}">${icon(ic)}<span>${label}</span>${id==='alerts'&&unread?`<span class="nav-count">${unread}</span>`:''}</button>`).join('');
  document.getElementById('desktop-nav').innerHTML=html(false);document.getElementById('mobile-nav').innerHTML=html(true);
}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3600)}
function closeModal(){document.getElementById('modal-cover').classList.remove('active');document.getElementById('modal').innerHTML=''}
function openModal(title,body){document.getElementById('modal').innerHTML=`<div class="modal-header"><h2>${title}</h2><button class="modal-close" aria-label="إغلاق" data-action="close-modal">${icon('x')}</button></div>${body}`;document.getElementById('modal-cover').classList.add('active')}
function fail(e){toast(e.message||'حدث خطأ')}
const field=(id,label,val,kind='input',wide=false,extra='')=>`<div class="field ${wide?'wide':''}"><label for="${id}">${label}</label>${kind==='textarea'?`<textarea id="${id}" ${extra}>${esc(val)}</textarea>`:`<input id="${id}" value="${esc(val)}" type="${kind==='number'?'number':'text'}" ${kind==='number'?'min="0" max="120"':''} ${extra}>`}</div>`;
const condChips=(name,sel)=>`<div class="chips">${[['MG','الوهن العضلي الوبيل'],['G6PD','نقص إنزيم G6PD']].map(([c,l])=>`<label class="chip ${sel.includes(c)?'on':''}"><input type="checkbox" name="${name}" value="${c}" ${sel.includes(c)?'checked':''}>${l}</label>`).join('')}</div>`;
const needPatient=()=>`<div class="panel"><div class="empty">${icon('users')}لا يوجد مريض محدد. أضف مريضًا أو اختر من القائمة.</div><div class="form-actions"><button class="btn" data-action="add-patient">${icon('plus')} إضافة مريض</button><button class="btn ghost" data-view="patients">قائمة المرضى</button></div></div>`;
function profile(){const x=detail.patient;return `<div class="patient-profile"><div class="avatar">${initial(x.name)}</div><div style="flex:1"><h2>${esc(x.name)}</h2><p>${esc(x.age)} سنة${x.sex?' · '+esc(x.sex):''} · ${esc(condText(x))}</p>${(x.allergies||[]).length?`<p>الحساسية: ${x.allergies.map(a=>`<span class="allergy-chip">${esc(a.label)}</span>`).join('')}</p>`:''}<p>آخر تأكيد: ${esc(date(x.lastConfirmedAt))}${x.stale?' · <b style="color:#9C6019">يحتاج تأكيد</b>':''}</p></div></div>`}

// ---------------- phone notifications (Web Push)
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches;
let pushState='checking',pushDevices=0;
function b64ToBytes(b){const p='='.repeat((4-b.length%4)%4);const s=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...s].map(c=>c.charCodeAt(0)));}
async function swReg(){return navigator.serviceWorker.register('/sw.js',{scope:'/'});}
async function refreshPush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){pushState=isIOS&&!isStandalone()?'ios-home':'unsupported';return}
  if(Notification.permission==='denied'){pushState='denied';return}
  try{const reg=await swReg();const sub=await reg.pushManager.getSubscription();const k=await api('/api/push/key');pushDevices=k.devices;pushState=sub?'on':'off';}catch(e){pushState='off'}
}
async function enablePush(){
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){pushState='denied';render();return}
  const reg=await swReg();await navigator.serviceWorker.ready;
  const {publicKey}=await api('/api/push/key');
  let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(publicKey)});
  const r=await api('/api/push/subscribe',{method:'POST',body:{subscription:sub.toJSON()}});
  pushDevices=r.devices;pushState='on';render();toast('تفعّلت الإشعارات على هذا الجهاز');
}
async function disablePush(){const reg=await swReg();const sub=await reg.pushManager.getSubscription();if(sub){await api('/api/push/unsubscribe',{method:'POST',body:{endpoint:sub.endpoint}}).catch(()=>{});await sub.unsubscribe();}pushState='off';render();toast('أُوقفت الإشعارات على هذا الجهاز')}
function pushPanel(){
  const head=`<div class="section-header"><h2>إشعارات الجوال</h2>${pushState==='on'?'<span class="badge">مفعّلة</span>':pushState==='checking'?'':'<span class="badge gray">غير مفعّلة</span>'}</div>`;
  let body='';
  if(pushState==='on')body=`<p class="minor">يوصلك إشعار على هذا الجهاز لما تطلع نتيجة «تجنّب» لأحد مرضاك، أو يطلب معالج التواصل معك. الأجهزة المفعّلة: ${pushDevices}.</p><div class="form-actions"><button class="btn small ghost" data-action="push-test">${icon('bell')} أرسل إشعار تجربة</button><button class="btn small light" data-action="push-off">إيقاف على هذا الجهاز</button></div>`;
  else if(pushState==='off')body=`<p class="minor">فعّلها على جوالك حتى يوصلك التنبيه وأنت برا اللوحة.</p><button class="btn full" data-action="push-on">${icon('bell')} فعّل الإشعارات على هذا الجهاز</button>`;
  else if(pushState==='ios-home')body=`<p class="minor">على آيفون، الإشعارات تشتغل بعد ما تضيف أمان للشاشة الرئيسية:</p><ol class="steps"><li>افتح هذي الصفحة في <b>Safari</b>.</li><li>اضغط زر <b>المشاركة</b> (المربع والسهم) ← <b>إضافة إلى الشاشة الرئيسية</b>.</li><li>افتح أمان من الأيقونة الجديدة، وارجع هنا واضغط «فعّل الإشعارات».</li></ol>`;
  else if(pushState==='denied')body=`<p class="minor">رفضت الإشعارات لهذا الموقع. فعّلها من إعدادات المتصفح أو الجوال (الإشعارات ← أمان)، ثم حدّث الصفحة.</p>`;
  else if(pushState==='unsupported')body=`<p class="minor">هذا المتصفح لا يدعم الإشعارات. على أندرويد استخدم Chrome، وعلى آيفون أضف أمان للشاشة الرئيسية من Safari.</p>`;
  else body='<p class="minor">جارٍ التحقق…</p>';
  return `<div class="panel">${head}${body}</div>`;
}

// ---------------- views
function stat(label,num,ic,tag){return `<div class="stat"><div class="row"><div class="symbol">${icon(ic)}</div>${tag?`<span class="badge ${tag[1]}">${tag[0]}</span>`:''}</div><div class="number">${num}</div><p>${label}</p></div>`}
function alertCard(a,compact){
  const lv=LV[a.level]||LV.avoid;
  if(a.type==='auto')return `<div class="alert-card auto ${a.status==='new'?'new':''}"><div class="row"><h3><span class="kind-tag">تنبيه تلقائي</span> ${esc(a.patientName)} · ${esc(a.drug)}</h3><span class="badge ${lv[1]}">${lv[0]}</span></div>
  <p>فحصه ${a.role==='patient'?'المريض أو عائلته':'معالج'} · ${esc(ago(a.createdAt))} · عبر ${a.kind==='wallet'?'البطاقة الرقمية':'الإسوارة'}</p>
  <p class="minor">ظهرت للمعالج نتيجة «تجنّب». لم يطلب التواصل بعد. إذا تبي تتأكد، اتصل بالمريض أو مرافقه.</p></div>`;
  return `<div class="alert-card ${a.status==='new'?'new':''}"><div class="row"><h3><span class="kind-tag req">طلب تواصل</span> ${esc(a.patientName)} · ${esc(a.drug)}</h3><span class="badge ${lv[1]}">${lv[0]}</span></div>
  <p>${a.role==='patient'?'المريض أو عائلته':'معالج'}${a.place?' في '+esc(a.place):''} · ${esc(ago(a.createdAt))} · عبر ${a.kind==='wallet'?'البطاقة الرقمية':'الإسوارة'}</p>
  ${a.note?`<p><b>ملاحظة:</b> ${esc(a.note)}</p>`:''}
  ${a.reply?`<div class="reply-done"><b>ردّك:</b> ${esc(a.reply)}</div>`:`<div class="quick-replies">${['لا تعطه. اختر بديلًا مع الصيدلي.','مقبول مع مراقبة التنفس والقوة.','سأتصل بك الآن.'].map(r=>`<button type="button" data-reply="${esc(a.id)}" data-text="${esc(r)}">${esc(r)}</button>`).join('')}</div>${compact?'':`<div class="reply-row"><input id="reply-${esc(a.id)}" placeholder="أو اكتب ردًا…" maxlength="400"><button class="btn small" data-reply-input="${esc(a.id)}">${icon('send')} أرسل</button></div>`}`}</div>`;
}
function homepage(){
  const x=patients.find(p=>p.id===selected);
  const day=events.filter(e=>Date.now()-Date.parse(e.at)<86400000).length;
  const newA=alerts.filter(a=>a.status==='new');
  return `${bar(`مرحبًا، ${esc(me.name)}`,'ملفات مرضاك ووسائل وصولهم وطلبات التواصل من مكان واحد.','home')}
  ${me.demo?`<div class="info-banner">${icon('alert')}<span style="flex:1"><b>حساب التجربة مشترك:</b> أي شخص يدخل به يرى نفس المرضى. ترجع البيانات لأصلها بضغطة.</span><button class="btn small ghost" style="flex:0;min-width:auto" data-action="reset-demo">${icon('refresh')} إعادة ضبط</button></div>`:''}
  ${pushState==='on'?'':pushPanel()}
  <div class="grid-stat">${stat('المرضى',patients.length,'users')}${stat('تنبيهات جديدة',unread,'bell',unread?['جديد','red']:null)}${stat('إسوارات مفعّلة',patients.filter(q=>q.bandActive).length,'card')}${stat('أحداث آخر 24 ساعة',day,'log')}</div>
  ${newA.length?`<div class="section-header"><h2>تنبيهات جديدة</h2><button class="muted-link" data-view="alerts">عرض الكل ←</button></div>${newA.slice(0,3).map(a=>alertCard(a,true)).join('')}`:''}
  <div class="section-header"><h2>إجراءات سريعة</h2></div>
  <div class="actions" style="margin-bottom:22px"><button class="action-tile" data-action="add-patient"><span class="tile-icon">${icon('plus')}</span><span><strong>إضافة مريض</strong><small>ملف جديد ورابط إسوارة</small></span></button><button class="action-tile" data-view="rules"><span class="tile-icon">${icon('list')}</span><span><strong>قائمة التجنّب</strong><small>تعديل القائمة لكل مريض</small></span></button><button class="action-tile" data-view="access"><span class="tile-icon">${icon('wallet')}</span><span><strong>وسائل الوصول</strong><small>الإسوارة والبطاقة والرمز</small></span></button><button class="action-tile" data-view="logs"><span class="tile-icon">${icon('log')}</span><span><strong>سجل الوصول</strong><small>من فتح الملف ومتى</small></span></button><button class="action-tile" data-view="barcodes"><span class="tile-icon">${icon('barcode')}</span><span><strong>باركود الأدوية</strong><small>اربط علبة بدواء مرة واحدة</small></span></button></div>
  ${x?`<div class="section-header"><h2>المريض المحدد</h2><button class="muted-link" data-view="patients">كل المرضى ←</button></div><div class="panel"><div class="patient-row"><div class="avatar">${initial(x.name)}</div><div class="patient-body"><h3>${esc(x.name)}</h3><p>${esc(condText(x))}</p><p>آخر تأكيد: ${esc(date(x.lastConfirmedAt))}</p></div><span class="badge ${x.bandActive?'':'gray'}">${x.bandActive?'الإسوارة مفعّلة':'الإسوارة موقوفة'}</span></div><div class="mini-rule"></div><div class="form-actions"><button class="btn ghost" data-view="record">${icon('file')} الملف الطبي</button><a class="btn ghost" target="_blank" rel="noopener" href="${esc(detail?.patient.access.band.url||'#')}">${icon('ext')} افتح بطاقة الطوارئ</a></div></div>`:''}
  <div class="footer">أمان | المس · افحص · احمِ</div>`;
}
function patientRow(pt){return `<button class="list-card" type="button" data-patient="${esc(pt.id)}"><div class="avatar">${initial(pt.name)}</div><div class="meta"><strong>${esc(pt.name)}</strong><p>${esc(pt.age)} سنة · ${esc(condText(pt))}</p></div><div class="patient-right">${pt.id===selected?'<span class="badge">محدد</span>':''}${icon('arrow')}</div></button>`}
function filtered(){const q=search.trim().toLowerCase();return patients.filter(x=>(x.name+' '+condText(x)+' '+(x.diagnosisNote||'')).toLowerCase().includes(q))}

// ---------------- render
const VIEWS={barcodes:barcodesPage,overview:homepage,patients:patientsPage,record:recordPage,rules:rulesPage,access:accessPage,alerts:alertsPage,logs:logsPage};
function render(){drawNav();document.getElementById('app').innerHTML=VIEWS[view]();document.querySelectorAll('[data-qr]').forEach(el=>qr(el,el.dataset.qr,300));if(view==='alerts')markSeen();}
function softRender(){const a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&a.value)return;render();}
async function changeView(id){if(!VIEWS[id])return;if(window.AMANScan)AMANScan.stop();view=id;if(id==='logs')await loadEvents().catch(fail);if(id==='barcodes')await loadBarcodes().catch(fail);render();window.scrollTo({top:0,behavior:'instant'});}
async function markSeen(){const ids=alerts.filter(a=>a.status==='new').map(a=>a.id);if(!ids.length)return;for(const id of ids)await api(`/api/alerts/${id}`,{method:'POST',body:{action:'seen'}}).catch(()=>{});alerts.forEach(a=>{if(a.status==='new'){a.status='seen'}});unread=0;lastUnread=0;drawNav();}
async function refreshDetail(d){if(d&&d.patient){detail={...detail,...d};}else await loadDetail();await loadPatients();render();}

// ---------------- actions
function addPatient(){openModal('إضافة مريض',`<form id="add-patient-form" class="stack">${field('new-name','اسم المريض','')}<div class="contact-row" style="grid-template-columns:1fr 1fr">${field('new-age','العمر','','number')}<div class="field"><label for="new-sex">الجنس</label><select id="new-sex"><option value="">—</option><option>أنثى</option><option>ذكر</option></select></div></div><div class="field"><label>الحالة</label>${condChips('new-cond',[])}</div>${field('new-diagnosis','وصف التشخيص (اختياري)','')}<button class="btn full" type="submit">${icon('plus')} إنشاء الملف ورابط الإسوارة</button></form><p class="top-note">قائمة التجنّب تُبنى تلقائيًا من الحالة، وتعدّلها بعد الإنشاء.</p>`)}
function addMed(){openModal('إضافة دواء حالي',`<form id="add-med-form" class="stack">${field('new-med','اسم الدواء (علمي أو تجاري)','')}${field('new-dose','الجرعة','')}${field('new-when','مواعيد الاستخدام','')}<button class="btn full" type="submit">إضافة إلى القائمة</button></form>`)}
async function saveMeds(meds){try{const d=await api(`/api/patients/${selected}`,{method:'PUT',body:{meds}});await refreshDetail(d);toast('تم حفظ الأدوية')}catch(e){fail(e)}}
async function runAction(act,el){
  const x=detail&&detail.patient;
  try{
  if(act==='add-patient')addPatient();
  if(act==='add-med')addMed();
  if(act==='close-modal')closeModal();
  if(act==='logout'){await api('/api/auth/logout',{method:'POST'});location.replace('/doctor')}
  if(act==='reset-demo'){openModal('إعادة ضبط حساب التجربة',`<p class="sub" style="margin-bottom:16px">يرجع سارة ويوسف لبياناتهما الأصلية، وتُحذف التنبيهات والسجل وأي مريض أُضيف لهذا الحساب.</p><div class="form-actions"><button class="btn danger" data-action="reset-demo-yes">إعادة الضبط</button><button class="btn ghost" data-action="close-modal">إلغاء</button></div>`)}
  if(act==='reset-demo-yes'){await api('/api/demo/reset',{method:'POST'});closeModal();selected=null;await Promise.all([loadPatients(),loadAlerts(),loadEvents()]);await loadDetail();render();toast('رجعت بيانات التجربة لأصلها')}
  if(act==='verify'){const d=await api(`/api/patients/${selected}/confirm`,{method:'POST'});await refreshDetail(d);toast('سُجّل تأكيدك. يظهر التاريخ على بطاقة الطوارئ.')}
  if(act==='delete-patient'){openModal('حذف ملف المريض',`<p class="sub" style="margin-bottom:16px">سيُحذف ملف ${esc(x.name)} وتتوقف الإسوارة والبطاقة فورًا. لا يمكن التراجع.</p><div class="form-actions"><button class="btn danger" data-action="delete-yes">حذف نهائي</button><button class="btn ghost" data-action="close-modal">إلغاء</button></div>`)}
  if(act==='delete-yes'){await api(`/api/patients/${selected}`,{method:'DELETE'});closeModal();selected=null;await loadPatients();await loadDetail();view='patients';render();toast('حُذف الملف')}
  if(act==='reset-pin'){const r=await api(`/api/patients/${selected}/pin`,{method:'POST'});openModal('رمز الوصول الجديد',`<div class="pin">${esc(r.pin)}</div><p class="sub" style="margin-top:12px">أعطه للمريض أو مرافقه، أو اكتبه على ظهر بطاقته. لن يظهر مرة أخرى، والرمز القديم توقف.</p><button class="btn full" style="margin-top:12px" data-action="close-modal">تم</button>`)}
  if(act==='refresh-logs'){await loadEvents();render()}
  if(act==='push-on'){await enablePush()}
  if(act==='push-off'){await disablePush()}
  if(act==='push-test'){const r=await api('/api/push/test',{method:'POST'});toast(r.delivered?'أُرسل. المفروض يوصلك الإشعار خلال ثوانٍ.':'ما وصل لأي جهاز. فعّل الإشعارات مرة ثانية.')}
  if(act==='scan-start'){const box=document.getElementById('dash-scan');box.hidden=false;try{await AMANScan.start(document.getElementById('dash-video'),code=>{box.hidden=true;document.getElementById('bc-code').value=code.replace(/\u001d/g,'');parseBc(code)})}catch(e){box.hidden=true;toast(e.name==='NotAllowedError'?'اسمح للمتصفح باستخدام الكاميرا':e.message)}}
  if(act==='scan-stop'){AMANScan.stop();document.getElementById('dash-scan').hidden=true}
  }catch(e){fail(e)}
}
document.addEventListener('click',async e=>{
  const t=e.target;
  const v=t.closest('[data-view]');if(v){closeModal();changeView(v.dataset.view);return}
  const pb=t.closest('[data-patient]');if(pb){selected=pb.dataset.patient;search='';await loadDetail().catch(fail);changeView('record');return}
  const act=t.closest('[data-action]');if(act){runAction(act.dataset.action,act);return}
  const rm=t.closest('[data-remove-med]');if(rm){const meds=detail.patient.meds.map(m=>({name:m.name,dose:m.dose,when:m.when}));meds.splice(Number(rm.dataset.removeMed),1);saveMeds(meds);return}
  const rr=t.closest('[data-remove-rule]');if(rr){try{await refreshDetail(await api(`/api/patients/${selected}/rules`,{method:'POST',body:{remove:rr.dataset.removeRule}}));toast('أُزيل لهذا المريض، ويبقى ظاهرًا كـ«بحذر»')}catch(er){fail(er)}return}
  const rs=t.closest('[data-restore]');if(rs){try{await refreshDetail(await api(`/api/patients/${selected}/rules`,{method:'POST',body:{restore:rs.dataset.restore}}));toast('رجع إلى القائمة')}catch(er){fail(er)}return}
  const ra=t.closest('[data-remove-allergy]');if(ra){try{await refreshDetail(await api(`/api/patients/${selected}/allergies`,{method:'POST',body:{remove:Number(ra.dataset.removeAllergy)}}));toast('حُذفت الحساسية')}catch(er){fail(er)}return}
  const rc=t.closest('[data-remove-custom]');if(rc){try{await refreshDetail(await api(`/api/patients/${selected}/rules`,{method:'POST',body:{removeCustom:Number(rc.dataset.removeCustom)}}))}catch(er){fail(er)}return}
  const cp=t.closest('[data-copy]');if(cp){toast(await copy(cp.dataset.copy)?'تم نسخ الرابط':'انسخ الرابط يدويًا');return}
  const tg=t.closest('[data-toggle]');if(tg){try{await refreshDetail(await api(`/api/patients/${selected}/access`,{method:'POST',body:{kind:tg.dataset.toggle,action:'toggle'}}));toast('تم تحديث الحالة. يسري فورًا.')}catch(er){fail(er)}return}
  const ri=t.closest('[data-reissue]');if(ri){openModal('إصدار رابط جديد',`<p class="sub" style="margin-bottom:16px">الرابط القديم يتوقف فورًا. ${ri.dataset.reissue==='band'?'تحتاج تكتب الرابط الجديد على الإسوارة.':'تحتاج ترسل رابط الاستلام الجديد للمريض.'}</p><div class="form-actions"><button class="btn" data-reissue-yes="${ri.dataset.reissue}">إصدار</button><button class="btn ghost" data-action="close-modal">إلغاء</button></div>`);return}
  const ry=t.closest('[data-reissue-yes]');if(ry){try{await refreshDetail(await api(`/api/patients/${selected}/access`,{method:'POST',body:{kind:ry.dataset.reissueYes,action:'reissue'}}));closeModal();toast('صدر رابط جديد')}catch(er){fail(er)}return}
  const db=t.closest('[data-del-bc]');if(db){try{await api(`/api/barcodes/${db.dataset.delBc}`,{method:'DELETE'});await loadBarcodes();render();toast('حُذف الربط')}catch(er){fail(er)}return}
  const rp=t.closest('[data-reply]');if(rp){sendReply(rp.dataset.reply,rp.dataset.text);return}
  const rpi=t.closest('[data-reply-input]');if(rpi){const inp=document.getElementById('reply-'+rpi.dataset.replyInput);if(inp&&inp.value.trim())sendReply(rpi.dataset.replyInput,inp.value.trim());return}
});
async function sendReply(id,text){try{await api(`/api/alerts/${id}`,{method:'POST',body:{action:'reply',reply:text}});await loadAlerts();render();toast('وصل ردّك للمعالج')}catch(e){fail(e)}}
document.addEventListener('change',async e=>{const c=e.target.closest('.chip');if(c)c.classList.toggle('on',e.target.checked);
  if(e.target.id==='auto-notify'){try{const d=await api(`/api/patients/${selected}`,{method:'PUT',body:{autoNotify:e.target.checked}});detail={...detail,...d};toast(e.target.checked?'التنبيه التلقائي مفعّل لهذا المريض':'أُوقف التنبيه التلقائي لهذا المريض')}catch(er){fail(er);e.target.checked=!e.target.checked}}});
let lastRawBc='';
async function parseBc(raw){lastRawBc=raw;const box=document.getElementById('bc-info');if(!box)return;try{const r=await api('/api/barcodes/parse',{method:'POST',body:{code:raw}});const b=r.barcode;box.innerHTML=`<div class="test-result ${b.validCheckDigit?'none':'caution'}">رقم المنتج: <b dir="ltr">${esc(b.gtin)}</b>${b.expiry?` · ينتهي <span dir="ltr">${esc(b.expiry)}</span>`:''}${b.batch?` · تشغيلة <span dir="ltr">${esc(b.batch)}</span>`:''}${b.validCheckDigit?'':'<br>خانة التحقق غير صحيحة: راجع الرقم.'}${r.existing?`<br>مربوط حاليًا بـ <b>${esc(r.existing.label)}</b> (${esc(r.existing.drug.ar)}). الحفظ يستبدله.`:''}</div>`;if(r.existing&&!document.getElementById('bc-drug').value)document.getElementById('bc-drug').value=r.existing.drug.en;}catch(e){box.innerHTML=`<div class="test-result avoid">${esc(e.message)}</div>`}}
let sugT;
document.addEventListener('input',e=>{
  if(e.target.id==='bc-drug'){clearTimeout(sugT);const v=e.target.value.trim();if(v.length<2)return;sugT=setTimeout(()=>api('/api/suggest?q='+encodeURIComponent(v)).then(d=>{const dl=document.getElementById('bc-sugg');if(dl)dl.innerHTML=d.suggestions.map(x=>`<option value="${esc(x.en)}">${esc(x.ar)}</option>`).join('')}).catch(()=>{}),200);return}
  if(e.target.id==='bc-code'){const v=e.target.value.replace(/\s/g,'');if(/^\d{8}$|^\d{12,14}$/.test(v))parseBc(v);else document.getElementById('bc-info').innerHTML='';return}if(e.target.id==='patient-search'){search=e.target.value;const r=filtered();document.getElementById('patient-results').innerHTML=r.map(patientRow).join('')||`<div class="empty">${icon('search')}لا توجد نتائج</div>`}});
document.addEventListener('submit',async e=>{
  const f=e.target;e.preventDefault();const g=id=>(document.getElementById(id)?.value||'').trim();
  const btn=f.querySelector('[type=submit]');if(btn)btn.disabled=true;
  try{
  if(f.id==='add-patient-form'){
    const conditions=[...f.querySelectorAll('input[name=new-cond]:checked')].map(i=>i.value);
    const r=await api('/api/patients',{method:'POST',body:{name:g('new-name'),age:g('new-age'),sex:g('new-sex'),conditions,diagnosisNote:g('new-diagnosis')}});
    selected=r.patient.id;await loadPatients();await loadDetail();
    openModal('تم إنشاء الملف',`<p class="sub">رمز الوصول للملف الكامل:</p><div class="pin" style="margin:10px 0">${esc(r.pin)}</div><p class="sub">احفظه وأعطه للمريض. لن يظهر مرة أخرى (تقدر تصدر رمزًا جديدًا).</p><div class="access-id">${esc(r.patient.access.band.shortUrl)}</div><div class="form-actions"><button class="btn" data-action="close-modal" data-view="record">أكمل الملف</button><button class="btn ghost" data-action="close-modal" data-view="access">رابط الإسوارة</button></div>`);
    view='record';render();
  }
  if(f.id==='add-med-form'){const name=g('new-med');if(!name)return;const meds=detail.patient.meds.map(m=>({name:m.name,dose:m.dose,when:m.when}));meds.push({name,dose:g('new-dose'),when:g('new-when')});closeModal();await saveMeds(meds)}
  if(f.id==='record-form'){
    const contacts=[0,1].map(i=>({name:g('c-name-'+i),relation:g('c-rel-'+i),phone:g('c-phone-'+i)}));
    const conditions=[...f.querySelectorAll('input[name=edit-cond]:checked')].map(i=>i.value);
    const d=await api(`/api/patients/${selected}`,{method:'PUT',body:{name:g('edit-name'),age:g('edit-age'),sex:g('edit-sex'),diagnosisYear:g('edit-year'),diagnosisNote:g('edit-diagnosis'),conditions,contacts,doctorName:g('edit-doctor'),doctorSpecialty:g('edit-spec'),doctorPhone:g('edit-doctor-phone'),history:{episodes:g('edit-episodes'),treatments:g('edit-treatments'),conditions:g('edit-conditions'),tests:g('edit-tests')},plan:g('edit-plan')}});
    await refreshDetail(d);toast('حُفظ. بطاقة الطوارئ تعرض التعديل الآن.');
  }
  if(f.id==='barcode-form'){const raw=lastRawBc&&lastRawBc.replace(/\u001d/g,'')===g('bc-code')?lastRawBc:g('bc-code');if(!raw)return;const r=await api('/api/barcodes',{method:'POST',body:{code:raw,drug:g('bc-drug'),label:g('bc-label')}});toast(`رُبط ${r.barcode.label} بـ ${r.barcode.drug.ar}`);lastRawBc='';await loadBarcodes();render();}
  if(f.id==='allergy-form'){const body={add:{group:g('al-group'),name:g('al-name'),reaction:g('al-reaction'),year:g('al-year'),certainty:g('al-cert'),note:g('al-note')}};if(!body.add.group&&!body.add.name){toast('اختر نوع الحساسية أو اكتب الدواء المسبب');return}await refreshDetail(await api(`/api/patients/${selected}/allergies`,{method:'POST',body}));toast('أُضيفت الحساسية، وتظهر على بطاقة الطوارئ الآن')}
  if(f.id==='custom-form'){const name=g('custom-name');if(!name)return;await refreshDetail(await api(`/api/patients/${selected}/rules`,{method:'POST',body:{addCustom:{name,note:g('custom-note')}}}));toast('أُضيف إلى قائمة التجنّب')}
  if(f.id==='test-form'){
    const q=g('test-q');if(!q)return;const r=await api(`/api/patients/${selected}/check`,{method:'POST',body:{query:q}});const out=document.getElementById('test-out');
    if(r.status==='result'){const lv=LV[r.level];out.innerHTML=`<div class="test-result ${r.level}"><b>${esc(r.drug.map(d=>d.ar).join(' + '))}: ${lv[0]}</b>${r.findings.map(x=>`<div>• ${esc(x.reason)}${x.removed?' (أزلته أنت)':''}</div>`).join('')}${r.level==='none'?`<div>لا يوجد تنبيه في قائمة ${esc((r.noWarningFor||[]).join('، ')||'حالات المريض')}.</div>`:''}${(r.notReviewedFor||[]).length?`<div>غير موجود في قائمة ${esc(r.notReviewedFor.join('، '))}: يظهر للمعالج «راجع الصيدلي».</div>`:''}${r.verifyIngredients?'<div>في الاسم كلمات غير معروفة: تحقق من المكونات.</div>':''}</div>`}
    else if(r.status==='confirm')out.innerHTML=`<div class="test-result none">هل تقصد: ${r.suggestions.map(s=>esc(s.ar)).join('، ')}؟ (لا نفحص اسمًا غير مؤكد)</div>`;
    else if(r.status==='need_route')out.innerHTML=`<div class="test-result none">يختلف التحذير حسب طريقة الإعطاء: ${r.options.map(o=>esc(o.ar)).join('، ')}. أضف الطريقة للاسم (مثل: بالوريد).</div>`;
    else out.innerHTML='<div class="test-result none">غير موجود في قائمة أمان. يظهر للمعالج «راجع الصيدلي».</div>';
  }
  }catch(er){fail(er)}finally{if(btn)btn.disabled=false}
});
document.getElementById('modal-cover').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
boot();
})();

</script>
