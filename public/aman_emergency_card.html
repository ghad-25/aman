adius:12px}.alert{margin-top:14px;background:var(--red-tint);border:1px solid var(--red-border);border-right:4px solid var(--red);border-radius:12px;padding:15px 15px 15px 14px}.alert-head{display:flex;align-items:center;gap:8px;color:#A8222F;font-size:13px;font-weight:800}.alert-title{font-size:16px;font-weight:800;margin-top:7px;color:#8C1D2A}.alert-copy{font-size:12px;color:#8C2F36;margin-top:4px;line-height:1.95}.check-button{width:100%;margin-top:16px;border:0;color:#fff;background:var(--teal);border-radius:12px;min-height:66px;display:flex;align-items:center;justify-content:center;gap:13px;box-shadow:0 6px 14px rgba(10,123,194,.18);transition:transform .18s,background .18s}.check-button:hover{background:#07639f}.check-button:active{transform:scale(.99)}.check-button strong{font-size:17px;font-weight:800;display:block;line-height:1.4}.check-button small{display:block;font-size:10.5px;color:#dbeaf5;text-align:right;margin-top:3px}.section{margin-top:27px}.section-title{gap:8px;color:var(--heading);font-size:15px;font-weight:800;margin-bottom:12px}.section-title .section-icon{color:var(--teal)}.accordion{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:11px}.accordion.red{border-color:#f5dfe0}.accordion.amber{border-color:#f4e9d4}.accordion-btn{width:100%;border:0;text-align:right;background:#fff;display:flex;align-items:center;gap:10px;padding:14px 13px;justify-content:space-between}.accordion.red .accordion-btn{background:var(--red-tint)}.accordion.amber .accordion-btn{background:var(--amber-tint)}.acc-right{display:flex;align-items:center;gap:11px;min-width:0}.acc-icon{width:37px;height:37px;display:grid;place-items:center;border-radius:11px;flex-shrink:0}.red .acc-icon{background:#ffe4e5;color:var(--red)}.amber .acc-icon{background:#fff0cc;color:var(--amber)}.acc-label{font-size:13.5px;font-weight:800}.red .acc-label{color:#a7222f}.amber .acc-label{color:#9b5800}.acc-summary{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:1px;line-height:1.7}.arrow{transition:transform .2s;color:#7d8294}.accordion[data-open="true"] .arrow{transform:rotate(180deg)}.accordion-panel{display:none;padding:2px 15px 8px;background:#fff}.accordion[data-open="true"] .accordion-panel{display:block}.risk-item{padding:12px 0;border-bottom:1px solid #edeef3}.risk-item:last-child{border-bottom:0}.risk-name{font-size:12px;font-weight:800;color:var(--heading);line-height:1.8}.latin{font-family:Arial,sans-serif;font-weight:600;direction:ltr;unicode-bidi:isolate;display:inline;font-size:11px;color:#5f7180}.risk-description{font-size:11px;line-height:1.9;color:#566678;margin-top:6px}.risk-description b{font-weight:800;color:var(--body)}.meds{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 15px;box-shadow:var(--shadow)}.med-row{padding:11px 0;gap:8px;border-bottom:1px solid #ecedf2;font-weight:700;font-size:12px}.med-row:last-child{border-bottom:0}.med-row .med-icon{width:29px;height:29px;background:#edf3f7;border-radius:9px;display:grid;place-items:center;color:var(--teal)}.med-name{flex:1}.contact-card{border:1px solid var(--line);background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:0 14px}.contact-line{padding:14px 0;gap:10px}.contact-line+.contact-line{border-top:1px solid #edeef3}.contact-icon{width:40px;height:40px;background:#eff4f7;color:var(--teal);border-radius:12px;display:grid;place-items:center}.contact-info{flex:1;min-width:0}.contact-info b{display:block;font-size:12.5px;line-height:1.55}.contact-info small{display:block;color:var(--muted);font-size:10.5px;margin-top:3px}.contact-button{border:1px solid #d3dfe8;border-radius:10px;display:flex;align-items:center;gap:5px;padding:8px 10px;background:#f0f5f9;color:var(--teal);font-size:11px;font-weight:800}.full-record{margin-top:24px;border:1.5px solid var(--teal);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:53px;color:var(--teal);font-weight:800;font-size:13px}.full-record:hover{background:#e9f1f7}.privacy-line{text-align:center;color:var(--muted);font-size:10px;margin-top:14px}.demo-note{text-align:center;font-size:10px;color:#808492;line-height:1.8;margin-top:10px}.footer{padding:4px 18px 27px;text-align:center}.footer-line{height:1px;background:#dae2e8;margin-bottom:13px}.footer-brand{font-size:10px;color:#7e87a8;font-weight:700;letter-spacing:.2px}.overlay{position:fixed;inset:0;z-index:99;background:rgba(14,61,97,.43);display:flex;align-items:center;justify-content:center;padding:22px;animation:fadein .15s}.overlay[hidden]{display:none}.dialog{background:#fff;border-radius:14px;padding:26px 21px 19px;max-width:365px;width:100%;box-shadow:0 24px 66px rgba(0,0,0,.16);text-align:center}.dialog-symbol{width:54px;height:54px;background:#e7f0f7;border-radius:12px;display:grid;place-items:center;margin:0 auto 12px;color:var(--teal)}.dialog h3{font-size:17px;font-weight:800}.dialog p{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.9}.dialog button{margin-top:19px;min-height:46px;width:100%;border-radius:12px;background:var(--teal);color:#fff;border:0;font-weight:800}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes fadein{from{opacity:0}to{opacity:1}}@media(min-width:520px){body{padding:28px 14px}.shell{min-height:calc(100svh - 56px);border-radius:14px;overflow:hidden}}@media(max-width:350px){main{padding-inline:14px}.topbar{padding-inline:15px}.patient-name{font-size:21px}.alert-title{font-size:14px}.brand-name{font-size:19px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

<div class="shell">
 <header class="topbar s-nav"><div class="s-nav-row"><span class="s-back" hidden></span><div class="s-title">بطاقة الطوارئ</div><span class="s-end"><span class="demo-pill" id="kind-pill">بطاقة طوارئ</span></span></div></header>

<script>
(function(){
'use strict';
const {api,esc,date,token}=AMAN;
const app=document.getElementById('app');
const svg=(id,s=19)=>`<svg width="${s}" height="${s}"><use href="#${id}"/></svg>`;
function risk(g){
  const names=g.items.map(i=>esc(i.ar)).join('، ');
  const latin=g.items.map(i=>esc(i.en)).join(', ');
  const tag=g.removed?'<span class="risk-tag">أزاله الطبيب المعالج</span>':'';
  const notes=[...new Set(g.items.flatMap(i=>i.notes||[]))].filter(n=>!g.removed||!n.includes('أزاله'));
  return `<div class="risk-item"><div class="risk-name">${names} <span class="latin">(${latin})</span>${tag}</div><div class="risk-cond">${esc(g.classAr)} · ${esc(g.conditionAr)}</div><p class="risk-description"><b>السبب:</b> ${esc(g.reason)}${g.action?`<br><b>الإجراء:</b> ${esc(g.action)}`:''}${notes.length?`<br><b>ملاحظة:</b> ${esc(notes.join(' '))}`:''}</p></div>`;
}
function acc(cls,id,label,summary,body,open){
  return `<div class="accordion ${cls}" data-open="${open?'true':'false'}"><button type="button" class="accordion-btn" aria-expanded="${open?'true':'false'}" aria-controls="${id}"><span class="acc-right"><span class="acc-icon">${svg(cls==='blue'?'i-info':'i-alert',21)}</span><span><span class="acc-label">${label}</span><span class="acc-summary">${summary}</span></span></span><svg width="19" height="19" class="arrow"><use href="#i-down"/></svg></button><div id="${id}" class="accordion-panel">${body}</div></div>`;
}
function render(c){
  document.title=`أمان | بطاقة طوارئ — ${c.name}`;
  document.getElementById('kind-pill').textContent=c.accessKind==='wallet'?'البطاقة الرقمية':'إسوارة أمان';
  const L=c.lists;
  const count=a=>a.reduce((n,g)=>n+g.items.length,0);
  const avoidBody=L.custom.map(x=>`<div class="risk-item"><div class="risk-name">${esc(x.name)} <span class="risk-tag" style="background:#FFE4E5;color:#A7222F">أضافه الطبيب المعالج</span></div><p class="risk-description"><b>السبب:</b> ${esc(x.note||'قرار الطبيب المعالج لهذا المريض.')}<br><b>الإجراء:</b> لا يُعطى إلا بعد التواصل مع الطبيب المعالج.</p></div>`).join('')+L.avoid.map(risk).join('');
  const nonDrug=L.nonDrug.length?`<section class="section nondrug" aria-label="تجنّب أيضًا"><h2 class="section-title">${svg('i-alert')}<span>تجنّب أيضًا (غير الأدوية)</span></h2><div class="meds">${L.nonDrug.map(n=>`<div class="med-row" style="align-items:flex-start"><span class="med-icon" style="background:#FFE4E5;color:#C52533">${svg('i-alert',17)}</span><span class="med-name">${esc(n.ar)}<small style="display:block;font-weight:500;color:#8C2F36;font-size:11px;line-height:1.7">${esc(n.advice)}</small></span></div>`).join('')}</div></section>`:'';
  const AL=L.allergies||[];
  const allergyHtml=AL.map(a=>`<section class="allergy-box ${a.notAllergy?'soft':''}" aria-label="${esc(a.label)}"><div class="al-head">${svg('i-alert',17)}<span>${a.notAllergy?'عرض جانبي مسجّل (ليس حساسية)':'حساسية مسجّلة'}</span></div><h2 class="al-title">${esc(a.label)}</h2><p class="al-meta">${esc(a.reaction)}${a.year?' · '+esc(a.year):''} · ${esc(a.certainty)}${a.note?'<br>'+esc(a.note):''}</p>${a.avoid.length?`<p class="al-line red"><b>لا تُعطى: </b>${a.avoid.map(esc).join('، ')}</p>`:''}${a.caution.length?`<p class="al-line amber"><b>بحذر: </b>${a.caution.map(esc).join('، ')}</p>`:''}${a.info.length?`<p class="al-line blue"><b>تُعطى عادة مع المراقبة: </b>${a.info.map(esc).join('، ')}</p>`:''}</section>`).join('');
  const meds=c.meds.length?c.meds.map(m=>`<div class="med-row"><span class="med-icon">${svg('i-pill',17)}</span><span class="med-name">${esc(m.name)}</span></div>`).join(''):'<div class="med-row"><span class="med-name" style="color:#6e7890;font-weight:500">لا توجد أدوية حالية مسجلة.</span></div>';
  const tel=p=>String(p||'').replace(/[^\d+]/g,'');
  const contacts=[...c.contacts.map(x=>({icon:'i-user',title:`${x.name}${x.relation?' — '+x.relation:''}`,sub:x.phone,phone:x.phone})),
    {icon:'i-call',title:`${c.doctor.name||'الطبيب المعالج'} — الطبيب المعالج`,sub:[c.doctor.specialty,c.doctor.phone].filter(Boolean).join(' · '),phone:c.doctor.phone}];
  app.innerHTML=`
  <section class="identity" aria-label="بيانات المريض"><div class="person-line"><div><div class="person-label">الملف الطبي ${c.sex==='أنثى'?'للمريضة':'للمريض'}</div><h1 class="patient-name">${esc(c.name)}</h1><div class="patient-sub"><span>${esc(c.age)} ${c.age<=10&&c.age>2?'سنوات':'سنة'}</span>${c.sex?`<span class="dot"></span><span>${esc(c.sex)}</span>`:''}</div></div><div class="identity-mark">${svg('i-user',24)}</div></div></section>
  ${c.conditions.map(x=>`<section class="alert" aria-label="تنبيه طبي مهم"><div class="alert-head">${svg('i-alert',18)}<span>تنبيه طبي مهم</span></div><h2 class="alert-title">${esc(x.ar)}</h2><p class="alert-copy">${esc(x.headline)}</p></section>`).join('')}
  ${allergyHtml}
  ${c.stale?`<div class="stale"><b>تنبيه:</b> مرّ أكثر من 6 أشهر على آخر تأكيد من الطبيب. تأكد من المعلومات مع الصيدلي أو الطبيب.</div>`:''}
  <button type="button" class="check-button" id="go-check">${svg('i-scan',28)}<span><strong>افحص دواء</strong><small>اكتب اسم الدواء أو صوّر العلبة</small></span></button>
  <section class="section" aria-label="تحذيرات الأدوية"><h2 class="section-title"><svg width="19" height="19" class="section-icon"><use href="#i-list"/></svg>تحذيرات الأدوية</h2>
   ${acc('red','red-list','لا تُعطى',`${count(L.avoid)+L.custom.length} دواء قد يسبب مضاعفات خطيرة`,avoidBody||'<p class="risk-description">لا توجد أدوية في هذه الفئة.</p>',false)}
   ${acc('amber','amber-list','تُعطى بحذر',`${count(L.caution)} دواء يتطلب مراجعة أو مراقبة`,L.caution.map(risk).join('')||'<p class="risk-description">لا توجد أدوية في هذه الفئة.</p>',false)}
   ${L.info.length?acc('blue','blue-list','معلومة للطاقم الصحي',`${count(L.info)} دواء: ملاحظة لا توقف العلاج`,L.info.map(risk).join(''),false):''}
  </section>
  ${nonDrug}
  <section class="section" aria-label="الأدوية الحالية"><h2 class="section-title"><svg width="19" height="19" class="section-icon"><use href="#i-pill"/></svg>الأدوية الحالية</h2><div class="meds">${meds}</div></section>
  <section class="section" aria-label="جهات التواصل"><h2 class="section-title"><svg width="19" height="19" class="section-icon"><use href="#i-call"/></svg>التواصل في الطوارئ</h2><div class="contact-card">${contacts.map(x=>`<div class="contact-line"><span class="contact-icon">${svg(x.icon)}</span><span class="contact-info"><b>${esc(x.title)}</b><small><bdi>${esc(x.sub)}</bdi></small></span>${tel(x.phone)?`<a class="contact-button" href="tel:${esc(tel(x.phone))}">${svg('i-call',15)}اتصال</a>`:''}</div>`).join('')}</div></section>
  <button class="full-record" type="button" id="go-record">${svg('i-lock')}افتح الملف الطبي الكامل</button>
  <p class="privacy-line">آخر تأكيد من الطبيب: ${esc(date(c.lastConfirmedAt))}</p>
  <p class="demo-note">قوائم الأدوية: ${c.conditions.map(x=>esc(x.version)).join('، ')}${AL.length?'، الحساسية '+esc(L.allergyVersion||''):''} · المصدر لكل قاعدة يظهر في فحص الدواء.<br>هذه المعلومات تساعد الطبيب ولا تغني عن قراره.</p>`;
  document.getElementById('go-check').addEventListener('click',()=>amanGo('aman_drug_checker.html'));
  document.getElementById('go-record').addEventListener('click',()=>amanGo('aman_access_code.html'));
  app.querySelectorAll('.accordion-btn').forEach(b=>b.addEventListener('click',()=>{const a=b.closest('.accordion');const o=a.dataset.open==='true';a.dataset.open=String(!o);b.setAttribute('aria-expanded',String(!o));}));
}
function fail(e){
  const code=e.data&&e.data.code;
  const title=code==='revoked'?'هذه الوسيلة موقوفة':code==='replaced'?'هذه الوسيلة استُبدلت':e.status===404?'الرابط غير صحيح':'تعذّر فتح البطاقة';
  app.innerHTML=`<div class="state"><div class="ico">${svg('i-alert',26)}</div><h1>${title}</h1><p>${esc(e.message)}</p></div>`;
}
if(!token){fail({status:404,message:'لا يوجد رمز إسوارة في الرابط.'});return;}
api(`/api/card/${encodeURIComponent(token)}`).then(d=>render(d.card)).catch(fail);
})();

</script>
<script src="/assets/sehhaty.js" defer></script>
</body>
</html>
